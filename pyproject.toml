[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miradouro"
dynamic = ["version"]
description = "Fotointerpretação de pontos de validação para mapeamento de uso e cobertura da terra"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hugo Salis" }]
keywords = ["remote-sensing", "land-cover", "accuracy-assessment", "photointerpretation", "earth-engine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "pyyaml>=6",
  "pydantic>=2",
  "tqdm>=4",
]

[project.optional-dependencies]
# Provedores de chips (GEE, basemap Esri, gráfico NDVI).
chips = [
  "earthengine-api>=1.0",
  "requests>=2.28",
  "pillow>=10",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pyproj>=3.5",
]
# Exportador AcATaMa: leitura da tag nodata do raster (--mapa).
acatama = [
  "rasterio>=1.3",
]
# Interface de interpretação (Sprint 2).
app = [
  "streamlit>=1.46",
  "pillow>=10",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff==0.17.0",   # fixado: a classificação de imports (isort) mudou entre versões e quebrou a CI (12/10/2026)
]

[project.scripts]
miradouro = "miradouro.cli:main"

[project.urls]
Homepage = "https://github.com/hugoh-sig/miradouro"

[tool.setuptools.dynamic]
version = { attr = "miradouro.__version__" }

[tool.setuptools.packages.find]
include = ["miradouro*"]

[tool.setuptools.package-data]
miradouro = ["interface/teclado_html/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]   # `from tests.conftest import …` funciona com `pytest` direto (CI) e com `python -m pytest`

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# explícito: sem isto, a detecção automática de primeira parte varia entre ambientes (local × Actions)
known-first-party = ["miradouro"]
