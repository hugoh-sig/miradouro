[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miradouro"
dynamic = ["version"]
description = "Fotointerpretação de pontos de validação para mapeamento de uso e cobertura da terra"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hugo Salis" }]
keywords = ["remote-sensing", "land-cover", "accuracy-assessment", "photointerpretation", "earth-engine"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "pyyaml>=6",
  "pydantic>=2",
  "tqdm>=4",
]

[project.optional-dependencies]
# Provedores de chips (GEE, basemap Esri, gráfico NDVI).
chips = [
  "earthengine-api>=1.0",
  "requests>=2.28",
  "pillow>=10",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pyproj>=3.5",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
]

[project.scripts]
miradouro = "miradouro.cli:main"

[project.urls]
Homepage = "https://github.com/hugosalis/miradouro"

[tool.setuptools.dynamic]
version = { attr = "miradouro.__version__" }

[tool.setuptools.packages.find]
include = ["miradouro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
